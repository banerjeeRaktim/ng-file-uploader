<div class="uploader-container">
  <h1>File Uploader</h1>

  <div class="upload-section" role="region" aria-label="File upload area">
    <label for="file-input" class="file-label">Choose a file to upload</label>
    <div class="input-group">
      <input id="file-input" type="file" (change)="onFileSelected($event)" class="file-input"
        accept=".jpg,.jpeg,.png,.pdf,.txt" aria-describedby="file-help" aria-label="Select file for upload" />
      <button (click)="uploadFile()" class="upload-btn" [disabled]="!file()" aria-label="Upload selected file">
        Upload
      </button>
    </div>
    <p id="file-help" class="file-help">
      Max file size: 10MB. Allowed types: JPEG, PNG, PDF, TXT
    </p>
  </div>

  @if (file()) {
    <div class="file-info" role="region" aria-label="Selected file information">
      <p><strong>File:</strong> <span class="file-name">{{ file()!.name }}</span></p>
      <p><strong>Size:</strong> <span>{{ fileSizeKB() }} KB</span></p>
    </div>
  }
  @if (error()) {
    <div class="error-message" role="alert">
      <p>{{ error() }}</p>
    </div>
  }
  @if (success()) {
    <div class="success-message" role="status" aria-live="polite">
      <p>{{ success() }}</p>
    </div>
  }
</div>
